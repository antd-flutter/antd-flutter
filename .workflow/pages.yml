# Gitee Go 流水线：构建静态站点产物并推送到 gitee-pages 分支
# GitCode 无静态托管；Gitee Pages 从 gitee-pages 分支根目录部署（需在仓库「服务」→ Gitee Pages 手动开通一次）
name: antd-flutter-pages
displayName: Build & Publish Static Site
triggers:
  push:
    branches:
      include:
        - master
stages:
  - name: build-site
    displayName: Build Site
    steps:
      - task: shell@latest
        inputs:
          script: |
            git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$HOME/flutter" || true
            export PATH="$HOME/flutter/bin:$PATH"
            ./scripts/build_site.sh
            ./scripts/publish_gitee_pages.sh
