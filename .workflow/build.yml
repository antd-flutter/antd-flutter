# Gitee Go 流水线：analyze + test + web 构建（与 GitHub ci.yml 命令对齐）
# 需在 Gitee 仓库「流水线」中启用 Gitee Go（如提示开通）
name: antd-flutter-ci
displayName: Analyze & Test & Web Build
triggers:
  push:
    branches:
      include:
        - master
stages:
  - name: analyze-test
    displayName: Analyze & Test
    steps:
      - task: shell@latest
        inputs:
          script: |
            git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$HOME/flutter" || true
            export PATH="$HOME/flutter/bin:$PATH"
            flutter --version
            flutter pub get
            flutter analyze
            flutter test
  - name: build-web
    displayName: Build Web
    steps:
      - task: shell@latest
        inputs:
          script: |
            export PATH="$HOME/flutter/bin:$PATH"
            cd example && flutter build web --release --base-href /antd-flutter/
