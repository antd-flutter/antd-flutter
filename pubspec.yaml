name: antd_flutter_plus
description: Ant Design v6 Flutter components library. A Flutter implementation of Ant Design with Design Token system.
version: 1.0.0-beta.2
homepage: https://antd-flutter.github.io/antd-flutter/
repository: https://github.com/antd-flutter/antd-flutter
issue_tracker: https://github.com/antd-flutter/antd-flutter/issues

topics:
  - ui
  - components
  - design-system
  - ant-design

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.3

  # L2/L3 子包（发布后自动从 pub.dev 解析）
  antd_color: ^0.1.0-beta.1
  antd_tokens: ^0.1.0-beta.1
  antd_theme: ^0.1.0-beta.1
  antd_icons_flutter: ^1.0.0
  antd_flutter_ui: ^0.1.0-beta.1
  antd_qrcode: ^0.1.0-beta.1
  antd_refresh: ^0.1.0-beta.1
  antd_swipe_action: ^0.1.0-beta.1
  cached_network_image: ^4.0.7

  material_ui: any
  cupertino_ui: any
dependency_overrides:
  antd_color:
    path: packages/antd_color
  antd_tokens:
    path: packages/antd_tokens
  antd_theme:
    path: packages/antd_theme
  antd_icons_flutter:
    path: packages/antd_icons_flutter
  antd_flutter_ui:
    path: packages/antd_flutter_ui
  antd_qrcode:
    path: packages/antd_qrcode
  antd_refresh:
    path: packages/antd_refresh
  antd_swipe_action:
    path: packages/antd_swipe_action

dev_dependencies:
  analyzer: ^8.0.0
  flutter_test:
    sdk: flutter
  device_preview: ^1.2.0
  flutter_lints: ^5.0.0
  vector_math: any
  path: any
flutter:
  uses-material-design: true