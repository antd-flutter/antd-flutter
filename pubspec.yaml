name: antd_flutter_plus
description: Ant Design v6 Flutter components library. A Flutter implementation of Ant Design with Design Token system.
version: 1.0.0-beta.2
homepage: https://flutter-open.github.io/antd-flutter/
repository: https://github.com/flutter-open/antd-flutter
issue_tracker: https://github.com/flutter-open/antd-flutter/issues

topics:
  - ui
  - components
  - design-system
  - ant-design

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # L2/L3 子包（发布后自动从 pub.dev 解析）
  antd_color: ^0.1.0-beta.1
  antd_tokens: ^0.1.0-beta.1
  antd_theme: ^0.1.0-beta.1
  antd_icons_flutter: ^1.0.0
  antd_flutter_ui: ^0.1.0-beta.1
  antd_qrcode: ^0.1.0-beta.1
  antd_refresh: ^0.1.0-beta.1
  antd_swipe_action: ^0.1.0-beta.1
  antd_calendar: ^0.1.0-beta.1
  antd_splitter: ^0.1.0-beta.1
  antd_image_viewer: ^0.1.0-beta.1
  antd_upload: ^0.1.0-beta.1
  antd_picker: ^0.1.0-beta.1
  antd_form: ^0.1.0-beta.1
  antd_tree: ^0.1.0-beta.1
  antd_carousel: ^0.1.0-beta.1
  antd_masonry: ^0.1.0-beta.1
  antd_floating: ^0.1.0-beta.1
  antd_keyboard: ^0.1.0-beta.1
  antd_table: ^0.1.0-beta.1
  antd_transfer: ^0.1.0-beta.1
  cached_network_image: ^4.0.7

  material_ui: any
  cupertino_ui: any
dependency_overrides:
  antd_color:
    path: packages/antd_color
  antd_tokens:
    path: packages/antd_tokens
  antd_theme:
    path: packages/antd_theme
  antd_icons_flutter:
    path: packages/antd_icons_flutter
  antd_flutter_ui:
    path: packages/antd_flutter_ui
  antd_qrcode:
    path: packages/antd_qrcode
  antd_refresh:
    path: packages/antd_refresh
  antd_swipe_action:
    path: packages/antd_swipe_action
  antd_calendar:
    path: packages/antd_calendar
  antd_splitter:
    path: packages/antd_splitter
  antd_image_viewer:
    path: packages/antd_image_viewer
  antd_upload:
    path: packages/antd_upload
  antd_picker:
    path: packages/antd_picker
  antd_form:
    path: packages/antd_form
  antd_tree:
    path: packages/antd_tree
  antd_carousel:
    path: packages/antd_carousel
  antd_masonry:
    path: packages/antd_masonry
  antd_floating:
    path: packages/antd_floating
  antd_keyboard:
    path: packages/antd_keyboard
  antd_table:
    path: packages/antd_table
  antd_transfer:
    path: packages/antd_transfer

dev_dependencies:
  analyzer: ^8.0.0
  flutter_test:
    sdk: flutter
  device_preview: ^1.2.0
  flutter_lints: ^5.0.0
  vector_math: any
  path: any
flutter:
  uses-material-design: true