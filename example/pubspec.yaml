name: antd_flutter_example
description: antd-flutter 官网示例与组件预览应用
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  antd_flutter_plus:
    path: ../
  device_preview: ^1.3.1

  antd_theme: any
  antd_keyboard: any
  material_ui: any
  cupertino_ui: any
dependency_overrides:
  antd_color:
    path: ../packages/antd_color
  antd_tokens:
    path: ../packages/antd_tokens
  antd_theme:
    path: ../packages/antd_theme
  antd_flutter_ui:
    path: ../packages/antd_flutter_ui
  antd_qrcode:
    path: ../packages/antd_qrcode
  antd_refresh:
    path: ../packages/antd_refresh
  antd_swipe_action:
    path: ../packages/antd_swipe_action
  antd_splitter:
    path: ../packages/antd_splitter
  antd_image_viewer:
    path: ../packages/antd_image_viewer
  antd_calendar:
    path: ../packages/antd_calendar
  antd_upload:
    path: ../packages/antd_upload
  antd_picker:
    path: ../packages/antd_picker
  antd_form:
    path: ../packages/antd_form
  antd_tree:
    path: ../packages/antd_tree
  antd_carousel:
    path: ../packages/antd_carousel
  antd_masonry:
    path: ../packages/antd_masonry
  antd_floating:
    path: ../packages/antd_floating
  antd_keyboard:
    path: ../packages/antd_keyboard
  antd_table:
    path: ../packages/antd_table
  antd_transfer:
    path: ../packages/antd_transfer

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/avatar_demo.png