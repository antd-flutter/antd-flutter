name: antd_flutter_example
description: antd-flutter 官网示例与组件预览应用
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  antd_flutter_plus:
    path: ../
  flutter_screenutil: ^5.9.3
  device_preview: ^1.2.0

dependency_overrides:
  antd_color:
    path: ../packages/antd_color
  antd_tokens:
    path: ../packages/antd_tokens
  antd_theme:
    path: ../packages/antd_theme

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true