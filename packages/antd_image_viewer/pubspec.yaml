name: antd_image_viewer
description: Ant Design (antd-mobile) ImageViewer component for Flutter. Full-screen image preview with pinch zoom, pan, double-tap zoom, multi-image paging and controlled open/close, aligned with antd-mobile ImageViewer API.
version: 0.1.0-beta.1
homepage: https://flutter-open.github.io/antd-flutter/
repository: https://github.com/flutter-open/antd-flutter
issue_tracker: https://github.com/flutter-open/antd-flutter/issues

topics:
  - ui
  - components
  - design-system
  - ant-design
  - image-viewer

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  antd_theme: ^1.0.0
  material_ui: ^1.11.0
  cached_network_image: ^4.0.7
  # R30.1/R30.3 轮子决策：photo_view（MIT）仅作缩放手势算法参考，
  # 缩放/平移/双击缩放引擎已在包内基于 InteractiveViewer 完全吸收改造，
  # 不直接依赖（保持零额外三方依赖）。
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
