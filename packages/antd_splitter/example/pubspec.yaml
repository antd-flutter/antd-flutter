name: antd_splitter_example
description: "Ant Design v6 Splitter for Flutter - component demo gallery."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.14.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  antd_splitter:
    path: ../
  antd_theme:
    path: ../../antd_theme
  antd_icons_flutter:
    path: ../../antd_icons_flutter
  material_ui: ^1.11.0

dependency_overrides:
  antd_theme:
    path: ../../antd_theme
  antd_icons_flutter:
    path: ../../antd_icons_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
