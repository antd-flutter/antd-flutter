name: antd_splitter
description: Ant Design v6 Splitter component for Flutter. Draggable split panels with horizontal/vertical layouts, min/max constraints, collapsible panels, controlled sizes and lazy dragging, aligned with antd React Splitter API.
version: 0.1.0-beta.1
homepage: https://flutter-open.github.io/antd-flutter/
repository: https://github.com/flutter-open/antd-flutter
issue_tracker: https://github.com/flutter-open/antd-flutter/issues

topics:
  - ui
  - components
  - design-system
  - ant-design
  - splitter

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  antd_theme: ^1.0.0
  antd_icons_flutter: ^1.0.0
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  antd_theme:
    path: ../antd_theme
  antd_icons_flutter:
    path: ../antd_icons_flutter
