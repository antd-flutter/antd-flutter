name: antd_icons_example
description: Ant Design Icons for Flutter - icon preview gallery.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  antd_icons_flutter:
    path: ../
  antd_flutter_plus:
    path: ../../../
  antd_theme: any
  intl: any

  material_ui: any
  cupertino_ui: any

dependency_overrides:
  antd_color:
    path: ../../antd_color
  antd_tokens:
    path: ../../antd_tokens
  antd_theme:
    path: ../../antd_theme
  antd_icons_flutter:
    path: ../
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true