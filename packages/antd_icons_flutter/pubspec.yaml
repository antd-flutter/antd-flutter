name: antd_icons_flutter
description: Ant Design icons for Flutter. 850+ icons — outlined & filled as TTF font, twotone via flutter_svg, plus a unified AntdIcon widget.
version: 1.0.0
homepage: https://antd-flutter.github.io/antd-flutter/
repository: https://github.com/antd-flutter/antd-flutter
issue_tracker: https://github.com/antd-flutter/antd-flutter/issues

topics:
  - ui
  - icons
  - design-system
  - ant-design

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: false
  fonts:
    - family: AntIcons
      fonts:
        - asset: fonts/AntIcons.ttf
  assets:
    - assets/twotone/