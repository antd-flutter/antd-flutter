name: antd_theme_example
description: Example app for antd_theme package.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: any
  antd_theme:
    path: ../

# 本地开发时覆盖传递依赖（antd_theme → antd_tokens/antd_color hosted 约束）
dependency_overrides:
  antd_color:
    path: ../../antd_color
  antd_tokens:
    path: ../../antd_tokens

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true