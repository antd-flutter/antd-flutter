name: antd_theme
description: Ant Design v6 theme system for Flutter. Theme data, shadow tokens, responsive breakpoints, and screen adaptation.
version: 1.0.0
homepage: https://flutter-open.github.io/antd-flutter/
repository: https://github.com/flutter-open/antd-flutter
issue_tracker: https://github.com/flutter-open/antd-flutter/issues

topics:
  - ui
  - design-system
  - ant-design
  - theme

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  antd_color: ^1.0.0
  antd_tokens: ^1.0.0
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: false

dependency_overrides:
  antd_color:
    path: ../antd_color
  antd_tokens:
    path: ../antd_tokens
