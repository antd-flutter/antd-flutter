name: antd_pull_to_refresh
description: Ant Design (antd-mobile v5) PullToRefresh component for Flutter. Pull-down / pull-up refresh with gesture state machine (idle/pulling/canRelease/refreshing/complete) and customizable header texts.
version: 0.1.0-beta.1
homepage: https://antd-flutter.github.io/antd-flutter/
repository: https://github.com/antd-flutter/antd-flutter
issue_tracker: https://github.com/antd-flutter/antd-flutter/issues

topics:
  - ui
  - components
  - design-system
  - ant-design
  - pull-to-refresh

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  antd_theme: ^1.0.0
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
