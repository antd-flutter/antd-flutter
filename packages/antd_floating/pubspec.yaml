name: antd_floating
description: Ant Design v6 Floating components for Flutter. Draggable floating panel with anchor snapping (AntFloatingPanel) and draggable floating bubble with menu expansion (AntFloatingBubble), aligned with antd-mobile FloatingPanel/FloatingBubble API.
version: 0.1.0-beta.1
homepage: https://flutter-open.github.io/antd-flutter/
repository: https://github.com/flutter-open/antd-flutter
issue_tracker: https://github.com/flutter-open/antd-flutter/issues

topics:
  - ui
  - components
  - design-system
  - ant-design
  - floating

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  antd_theme: ^1.0.0
  antd_icons_flutter: ^1.0.0
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

# 本地开发 path override（antd_theme 未发布）
dependency_overrides:
  antd_theme:
    path: ../antd_theme
  antd_icons_flutter:
    path: ../antd_icons_flutter
