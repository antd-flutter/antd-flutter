name: antd_calendar
description: Ant Design calendar and calendar picker for Flutter, sharing one core with platform-specific desktop (antd v6) and mobile (antd-mobile v5) renderers.
version: 1.0.1
homepage: https://flutter-open.github.io/antd-flutter/
repository: https://github.com/flutter-open/antd-flutter
issue_tracker: https://github.com/flutter-open/antd-flutter/issues

topics:
  - ui
  - components
  - design-system
  - ant-design
  - calendar

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  antd_theme: ^1.0.1
  antd_icons_flutter: ^1.0.0
  # 滚轮选择引擎（WheelPickerColumn 等）来自共享基础库，
  # 依赖方向约定：antd_calendar → antd_flutter_ui → antd_theme/tokens/color
  antd_flutter_ui: ^1.0.1
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
