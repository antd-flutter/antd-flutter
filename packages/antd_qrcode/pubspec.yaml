name: antd_qrcode
description: Ant Design v6 QRCode component for Flutter. QR code display with error levels, status overlays (expired/scanned) and embedded icon, aligned with antd React QRCode API.
version: 0.1.0-beta.1
homepage: https://antd-flutter.github.io/antd-flutter/
repository: https://github.com/antd-flutter/antd-flutter
issue_tracker: https://github.com/antd-flutter/antd-flutter/issues

topics:
  - ui
  - components
  - design-system
  - ant-design
  - qrcode

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  # QR 生成引擎经中间层隔离（qr_flutter 语义不泄漏到组件 API）
  qr_flutter: ^4.1.0
  antd_theme: ^1.0.0
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
