name: antd_tokens
description: Ant Design v6 Design Token system. Seed tokens, token generation algorithms, color token maps, and shadow tokens.
version: 0.1.0
homepage: https://antd-flutter.github.io/antd-flutter/
repository: https://github.com/antd-flutter/antd-flutter
issue_tracker: https://github.com/antd-flutter/antd-flutter/issues

topics:
  - ui
  - design-system
  - ant-design
  - tokens

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  antd_color: ^0.1.0

# 本地开发时使用 path 覆盖；发布前移除本段并确保 antd_color 已发布
dependency_overrides:
  antd_color:
    path: ../antd_color

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: false