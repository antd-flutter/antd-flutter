# GitCode (AtomGit Action) Pages 发布：构建 example 演示站 + icons 画廊并上传制品
# 构建逻辑与 .github/workflows/deploy.yml 一致，复用 scripts/build_site.sh
#
# 说明（调研结论）：截至 2026-11，GitCode 官方文档未公开 GitCode Pages（静态站点托管）
# 产品的开通与发布语法。本工作流先完成「构建 + 制品上传」，实际发布步骤待 Pages 开通后
# 按 GitCode 官方语法补齐（见 docs/plan/tasks/P02-gitcode-CI与静态站点.md 用户待办清单）。
name: Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  enable: true
  exceed-action: QUEUE

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  build-site:
    name: Build web site
    runs-on: [ubuntu-latest, x64, medium]
    env:
      FLUTTER_HOME: ${{ runner.temp }}/flutter
    steps:
      - name: Checkout source code
        uses: checkout

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          set -e
          if [ ! -x "$FLUTTER_HOME/bin/flutter" ]; then
            curl -sSL "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz" \
              -o /tmp/flutter.tar.xz
            mkdir -p "$FLUTTER_HOME"
            tar -xJf /tmp/flutter.tar.xz --strip-components=1 -C "$FLUTTER_HOME"
          fi
          export PATH="$FLUTTER_HOME/bin:$PATH"
          flutter --version

      # base-href 与 GitCode Pages 站点 URL 路径匹配；
      # GitCode Pages URL 形态确定后如与默认值不一致，
      # 通过 SITE_BASE_HREF / ICON_BASE_HREF 环境变量调整即可
      - name: Build & merge static site
        run: |
          export PATH="$FLUTTER_HOME/bin:$PATH"
          bash scripts/build_site.sh

      - name: Upload site artifact
        uses: upload-artifact
        with:
          name: gitcode-site
          path: build/site
