name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build web (release)
        working-directory: example
        run: flutter build web --release --base-href /${{ github.event.repository.name }}/

      - name: Install icons gallery dependencies
        working-directory: packages/antd_icons_flutter/example
        run: flutter pub get

      - name: Build icons gallery (release)
        working-directory: packages/antd_icons_flutter/example
        run: flutter build web --release --base-href /${{ github.event.repository.name }}/icons/

      - name: Merge sites into Pages artifact
        run: |
          mkdir -p site/icons
          cp -r example/build/web/* site/
          cp -r packages/antd_icons_flutter/example/build/web/* site/icons/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4