name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build web (release)
        working-directory: example
        run: flutter build web --release --base-href /${{ github.event.repository.name }}/

      - name: Install icons gallery dependencies
        working-directory: packages/antd_icons_flutter/example
        run: flutter pub get

      - name: Build icons gallery (release)
        working-directory: packages/antd_icons_flutter/example
        run: flutter build web --release --base-href /${{ github.event.repository.name }}/icons/

      # 独立组件包 example（R32/R33：随包拆分持续追加）
      - name: Install antd_qrcode example dependencies
        working-directory: packages/antd_qrcode/example
        run: flutter pub get

      - name: Build antd_qrcode example (release)
        working-directory: packages/antd_qrcode/example
        run: flutter build web --release --base-href /${{ github.event.repository.name }}/qr_code/

      - name: Install antd_refresh example dependencies
        working-directory: packages/antd_refresh/example
        run: flutter pub get

      - name: Build antd_refresh example (release)
        working-directory: packages/antd_refresh/example
        run: flutter build web --release --base-href /${{ github.event.repository.name }}/refresh/

      - name: Install antd_swipe_action example dependencies
        working-directory: packages/antd_swipe_action/example
        run: flutter pub get

      - name: Build antd_swipe_action example (release)
        working-directory: packages/antd_swipe_action/example
        run: flutter build web --release --base-href /${{ github.event.repository.name }}/swipe_action/

      - name: Merge sites into Pages artifact
        run: |
          mkdir -p site/icons site/qr_code site/refresh site/swipe_action
          cp -r example/build/web/* site/
          cp -r packages/antd_icons_flutter/example/build/web/* site/icons/
          cp -r packages/antd_qrcode/example/build/web/* site/qr_code/
          cp -r packages/antd_refresh/example/build/web/* site/refresh/
          cp -r packages/antd_swipe_action/example/build/web/* site/swipe_action/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4