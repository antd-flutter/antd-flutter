name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # dart analyze 会递归扫描 packages/*/example 嵌套包，
      # 需先为每个子包 example 解析依赖，否则 URI 无法解析报错
      - name: Install subpackage example dependencies
        run: |
          for d in packages/*/example; do
            if [ -f "$d/pubspec.yaml" ]; then
              echo "flutter pub get in $d"
              (cd "$d" && flutter pub get)
            fi
          done

      - name: Flutter analyze
        run: flutter analyze

      - name: Run tests
        run: |
          if [ -d test ]; then
            flutter test
          fi
          for d in packages/*; do
            if [ -d "$d/test" ]; then
              echo "flutter test in $d"
              (cd "$d" && flutter test)
            fi
          done

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
            build_cmd: flutter build apk --debug
          - target: web
            os: ubuntu-latest
            build_cmd: flutter build web
          - target: ios
            os: macos-latest
            build_cmd: flutter build ios --debug --no-codesign
          - target: windows
            os: windows-latest
            build_cmd: flutter build windows --debug
          - target: macos
            os: macos-latest
            build_cmd: flutter build macos --debug
          - target: linux
            os: ubuntu-latest
            build_cmd: flutter build linux --debug

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build ${{ matrix.target }}
        working-directory: example
        run: ${{ matrix.build_cmd }}